[package]
name = "pagesmith"
version = "0.1.0"
description = "PageSmith — Microsoft Word for HTML files"
authors = ["Utkarsh Kumar"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
html5ever = "0.38"
markup5ever = "0.38"
encoding_rs = "0.8"
tempfile = "3"
tendril = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
