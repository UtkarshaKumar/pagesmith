# PageSmith — Forge Configuration

model: claude-sonnet-4-6
max_walker_depth: 4
temperature: 0.3
max_tool_failure_per_turn: 3
max_requests_per_turn: 50

custom_rules: |
  1. Read CLAUDE.md before any work in this project. Then read PROBLEM.md → CONSTITUTION.md → MVP-OPTIONS.md → DECISIONS.md.
  2. Never modify the surgical engine's core model (source_model.rs, patch.rs) without an ADR.
  3. All Rust code must compile with `cargo build` before committing. All JS must pass lint.
  4. Follow Rust naming conventions: snake_case for functions/variables, CamelCase for types.
  5. Every new Rust module must have integration tests in `src-tauri/tests/`.
  6. No AI slop: no opinionated formatting, no smart cleanup, no guessing user intent.
  7. The source buffer is truth. Never derive source from the DOM.
  8. Save operations must be atomic (temp file → rename).
  9. Constitution principles are binary gates — a feature either passes or fails.

commands:
  - name: "task"
    description: "Execute a task from TASKS.md"
    prompt: |
      Read TASKS.md and identify the task to work on.
      Check dependencies are satisfied before starting.
      Follow the acceptance criteria exactly.
      Report completion with evidence.

  - name: "gate"
    description: "Run quality gate checks for current phase"
    prompt: |
      Run all quality gates for the current phase.
      Report pass/fail for each gate.
      If any gate fails, identify root cause and propose fix.

  - name: "eng-review"
    description: "Engineering review of current changes"
    prompt: |
      Review the current diff against CONSTITUTION.md principles.
      Check: E1-E5, T1-T5 compliance.
      Check: No regression in round-trip test suite.
      Output findings in FINDINGS/END_FINDINGS format.
